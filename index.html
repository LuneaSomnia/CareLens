<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CareLens</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

      body {
        font-family: 'Inter', sans-serif;
        background-color: #050505;
        color: #e0e0e0;
        overflow: hidden; /* Prevent scrolling on the 3D background */
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.05);
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.3);
      }

      /* Animations */
      @keyframes float {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-15px) rotate(2deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      
      @keyframes float-deep {
        0% { transform: translateZ(-50px) translateY(0px) rotate3d(1, 1, 1, 0deg); }
        50% { transform: translateZ(0px) translateY(-20px) rotate3d(1, 1, 1, 15deg); }
        100% { transform: translateZ(-50px) translateY(0px) rotate3d(1, 1, 1, 0deg); }
      }

      @keyframes pulse-glow-cyan {
        0%, 100% { box-shadow: 0 0 15px rgba(0, 255, 255, 0.3), inset 0 0 10px rgba(0, 255, 255, 0.1); }
        50% { box-shadow: 0 0 30px rgba(0, 255, 255, 0.6), inset 0 0 20px rgba(0, 255, 255, 0.3); }
      }

      @keyframes pulse-glow-blue {
        0%, 100% { box-shadow: 0 0 15px rgba(45, 91, 255, 0.3); }
        50% { box-shadow: 0 0 30px rgba(140, 82, 255, 0.6); }
      }

      @keyframes pulse-glow-purple {
        0%, 100% { box-shadow: 0 0 15px rgba(157, 70, 255, 0.3); }
        50% { box-shadow: 0 0 30px rgba(255, 0, 153, 0.6); }
      }

      @keyframes pulse-glow-green {
        0%, 100% { box-shadow: 0 0 15px rgba(0, 255, 148, 0.3); }
        50% { box-shadow: 0 0 30px rgba(0, 188, 212, 0.6); }
      }

      .animate-float {
        animation: float 6s ease-in-out infinite;
      }
      
      .animate-float-deep {
        animation: float-deep 12s ease-in-out infinite alternate;
      }
      
      /* Crystal Shapes - Rudimentary/Raw geometric forms */
      .crystal-raw-1 {
        clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%); /* Rhombus */
      }

      .crystal-raw-2 {
         clip-path: polygon(20% 0%, 80% 0%, 100% 100%, 0% 100%); /* Trapezoid/Shard */
      }
      
      .crystal-raw-3 {
        clip-path: polygon(50% 0%, 0% 100%, 100% 100%); /* Triangle */
      }
      
      .crystal-raw-4 {
         clip-path: polygon(0% 20%, 60% 20%, 100% 0%, 100% 50%, 70% 100%, 30% 100%, 0% 60%); /* Irregular chunk */
      }
      
      .crystal-shape {
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      }

      /* Base glass panel with 10% opacity */
      .glass-panel {
        background: rgba(18, 18, 18, 0.1); /* 10% opacity */
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      
      .perspective-3d {
        perspective: 1200px;
        transform-style: preserve-3d;
      }

      /* Vivid Crystal Styling */
      .crystal-vivid {
        filter: drop-shadow(0px 0px 5px rgba(255,255,255,0.4)) brightness(1.3);
        box-shadow: inset 0 0 10px rgba(255,255,255,0.3);
      }
      
      /* Markdown Styles */
      .markdown-content h1, .markdown-content h2, .markdown-content h3 {
        color: inherit; /* Use parent text color (usually themed) */
        font-weight: 700;
        margin-top: 1.5em;
        margin-bottom: 0.5em;
      }
      .markdown-content h1 { font-size: 1.5em; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 0.2em; }
      .markdown-content h2 { font-size: 1.25em; }
      .markdown-content h3 { font-size: 1.1em; }
      .markdown-content p { margin-bottom: 1em; line-height: 1.6; }
      .markdown-content ul { list-style-type: disc; padding-left: 1.5em; margin-bottom: 1em; }
      .markdown-content ol { list-style-type: decimal; padding-left: 1.5em; margin-bottom: 1em; }
      .markdown-content strong { color: white; font-weight: 600; }
      .markdown-content blockquote { border-left: 4px solid rgba(255,255,255,0.2); padding-left: 1em; font-style: italic; color: rgba(255,255,255,0.7); }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.35.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react-markdown": "https://esm.sh/react-markdown@9.0.1"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
